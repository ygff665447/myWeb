<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>归墟站 · 监控回放</title>
<link rel="stylesheet" href="css/horror.css">
</head>
<body>
<div class="fx-noise"></div>
<div class="fx-scan"></div>
<main id="app" class="center">
  <p class="ch">归墟站 · 监控回放</p>
  <div class="frame flicker">
    <img class="shot" src="../assets/p13.png" alt="" onerror="this.classList.add('missing')">
    <span class="tag">13A · 00:13</span>
  </div>
  <div class="silhouette"></div>
  <div class="code" style="text-align:left">&gt; 红雨衣老人站在 13A 面前。
&gt; 他慢慢脱下红雨衣。
&gt; 林野抬起头。
&gt; 他的脸，已经是红雨衣老人的脸。

&gt; 第 13 位乘客已归档。
&gt; 第 14 位乘客，待定。</div>
  <div class="gate" id="gate">
    <label>输入引导者编号，查看最终名单。</label>
    <input id="gateInput" autocomplete="off" spellcheck="false" placeholder="GUILD-___">
    <button id="gateBtn">确 认</button>
    <p class="hint" id="gateHint"></p>
  </div>
</main>
<button class="reset" id="reset">清除进度</button>
<script src="js/core.js"></script>
<script>
(function(){
  LT.mark('secret');
  LT.blip(60,.6,'sine',.05);
  LT.gate(document.getElementById('gate'),'GUILD-13A',function(){
    location.href='final.html';
  },'编号错误。你还没有资格。','secret');
})();
</script>
</body>
</html>
