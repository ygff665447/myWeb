<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>末班车档案 · 第三章</title>
<link rel="stylesheet" href="css/horror.css">
</head>
<body>
<div class="fx-noise"></div>
<div class="fx-scan"></div>
<main id="app">
  <p class="ch">第三章 · 生存指南</p>
  <div class="forum">
    <p class="postTitle">《三号线末班车第13站生存指南（勿回）》</p>
    <p class="postMeta">楼主：匿名 · 回复 47 · 查看 13013</p>
    <ol class="rules" id="rules">
      <li data-r="1">不要看窗外。</li>
      <li data-r="2">不要和红雨衣说话。</li>
      <li data-r="3">不要数乘客。</li>
      <li data-r="4">听到“归墟”立刻闭眼。</li>
    </ol>
    <div class="reply">
      <p>47L：如果已经数了呢？</p>
      <p>楼主：那你就是第 13 位。</p>
    </div>
  </div>
  <p class="dim">按正确顺序点击四条规则。</p>
  <div class="gate" id="gate">
    <label>请输入你的乘客编号。</label>
    <input id="gateInput" autocomplete="off" spellcheck="false" placeholder="— —">
    <button id="gateBtn">确 认</button>
    <p class="hint" id="gateHint"></p>
  </div>
</main>
<button class="reset" id="reset">清除进度</button>
<script src="js/core.js"></script>
<script>
(function(){
  var gate=document.getElementById('gate');
  var list=document.querySelectorAll('#rules li');
  var step=0;
  list.forEach(function(li){
    li.addEventListener('click',function(){
      var n=+li.dataset.r;
      if(n===step+1){
        li.classList.add('on');step++;
        LT.blip(320+step*70,.1,'sine',.055);
        if(step===4){
          gate.classList.add('show');
          document.getElementById('gateInput').focus();
        }
      }else{
        list.forEach(function(x){x.classList.remove('on')});
        step=0;
        LT.blip(80,.22,'square',.075);
      }
    });
  });
  LT.gate(gate,'13',function(){
    location.href='ch4.html';
  },'编号不对。你不是第 13 位。','ch3');
})();
</script>
</body>
</html>
