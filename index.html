<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极客视界 · GeekVid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Fira Code', 'Courier New', monospace;
            background: #0a0a0a;
            color: #d0d0d0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .app {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 40px;
            background: rgba(10, 10, 10, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            overflow: hidden;
        }
        .header {
            width: 100%;
            max-width: 1300px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.15);
            margin-bottom: 30px;
            flex-shrink: 0;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 26px;
            font-weight: 700;
            color: #00ff41;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.25);
        }
        .logo .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 28px;
            background: #00ff41;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 12px #00ff41;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .logo .tag {
            font-size: 14px;
            font-weight: 300;
            color: rgba(0, 255, 65, 0.5);
            letter-spacing: 2px;
            margin-left: 6px;
        }
        .header-right {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
            letter-spacing: 1px;
        }
        .header-right .time {
            color: rgba(0, 255, 65, 0.6);
        }
        .video-grid-wrapper {
            width: 100%;
            max-width: 1300px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
            max-height: 100%;
            padding: 4px 0;
            justify-items: center;
            align-items: start;
        }
        .video-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 65, 0.12);
            border-radius: 20px;
            padding: 18px 18px 22px;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }
        .video-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0, 255, 65, 0.15), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .video-card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: rgba(0, 255, 65, 0.35);
            box-shadow: 0 20px 60px rgba(0, 255, 65, 0.08), 0 8px 32px rgba(0, 0, 0, 0.7);
            background: rgba(255, 255, 255, 0.06);
        }
        .video-card:hover::before {
            opacity: 1;
        }
        .video-cover {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            background: radial-gradient(circle at 20% 30%, #1a2a1a, #0a0f0a);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            flex-shrink: 0;
            border: 1px solid rgba(0, 255, 65, 0.08);
            transition: border-color 0.3s ease;
        }
        .video-card:hover .video-cover {
            border-color: rgba(0, 255, 65, 0.25);
        }
        .video-cover .cover-symbol {
            font-size: 72px;
            font-weight: 300;
            color: rgba(0, 255, 65, 0.15);
            text-shadow: 0 0 40px rgba(0, 255, 65, 0.05);
            user-select: none;
            transition: all 0.4s ease;
            font-family: 'Fira Code', monospace;
        }
        .video-card:hover .cover-symbol {
            color: rgba(0, 255, 65, 0.25);
            transform: scale(1.05);
        }
        .video-cover .play-icon {
            position: absolute;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(0, 255, 65, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid rgba(0, 255, 65, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.35s ease;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.05);
        }
        .video-card:hover .play-icon {
            background: rgba(0, 255, 65, 0.2);
            border-color: #00ff41;
            box-shadow: 0 0 50px rgba(0, 255, 65, 0.15);
            transform: scale(1.08);
        }
        .play-icon svg {
            width: 22px;
            height: 22px;
            fill: #00ff41;
            margin-left: 3px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 65, 0.3));
        }
        .video-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .video-title {
            font-size: 18px;
            font-weight: 600;
            color: #e8e8e8;
            letter-spacing: 0.5px;
            line-height: 1.3;
            transition: color 0.3s ease;
        }
        .video-card:hover .video-title {
            color: #00ff41;
        }
        .video-title .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 400;
            color: rgba(0, 255, 65, 0.4);
            background: rgba(0, 255, 65, 0.06);
            padding: 0 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 65, 0.08);
            margin-left: 8px;
            vertical-align: middle;
            letter-spacing: 0.5px;
        }
        .video-desc {
            font-size: 13px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.35);
            line-height: 1.5;
            letter-spacing: 0.3px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-meta {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 10px;
        }
        .video-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .video-meta .dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #00ff41;
            opacity: 0.3;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-box {
            width: 100%;
            max-width: 960px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid rgba(0, 255, 65, 0.15);
            border-radius: 28px;
            padding: 30px 32px 34px;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.9), 0 0 80px rgba(0, 255, 65, 0.03);
            position: relative;
            animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-close {
            position: absolute;
            top: 18px;
            right: 22px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Fira Code', monospace;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .modal-close:hover {
            color: #00ff41;
            background: rgba(0, 255, 65, 0.06);
            transform: rotate(90deg);
        }
        .modal-video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(0, 255, 65, 0.08);
            margin-bottom: 20px;
        }
        .modal-video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }
        .modal-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .modal-info .title {
            font-size: 20px;
            font-weight: 600;
            color: #e8e8e8;
            letter-spacing: 0.5px;
        }
        .modal-info .title .badge {
            font-size: 13px;
            font-weight: 400;
            color: rgba(0, 255, 65, 0.4);
            background: rgba(0, 255, 65, 0.06);
            padding: 0 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 65, 0.08);
            margin-left: 10px;
        }
        .modal-info .hint {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        .modal-info .hint kbd {
            display: inline-block;
            padding: 2px 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            font-family: 'Fira Code', monospace;
        }
        .empty-state {
            color: rgba(255, 255, 255, 0.1);
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
            padding: 60px 0;
            text-align: center;
        }
        @media (max-width: 820px) {
            .app { padding: 20px 24px; }
            .header { flex-direction: column; align-items: flex-start; gap: 8px; padding-bottom: 16px; margin-bottom: 20px; }
            .logo { font-size: 22px; }
            .logo .cursor-blink { height: 24px; width: 8px; }
            .header-right { font-size: 12px; }
            .video-grid { grid-template-columns: 1fr; gap: 24px; max-width: 480px; }
            .video-card { max-width: 100%; padding: 14px 14px 18px; }
            .video-cover .cover-symbol { font-size: 48px; }
            .video-cover .play-icon { width: 44px; height: 44px; }
            .play-icon svg { width: 18px; height: 18px; }
            .video-title { font-size: 16px; }
            .modal-box { padding: 20px 16px 22px; border-radius: 20px; }
            .modal-close { top: 12px; right: 14px; font-size: 22px; }
            .modal-info .title { font-size: 17px; }
            .modal-info .hint { font-size: 12px; }
            .modal-info .hint kbd { padding: 1px 8px; font-size: 11px; }
        }
        @media (max-width: 480px) {
            .app { padding: 12px 14px; }
            .logo { font-size: 18px; gap: 8px; }
            .logo .cursor-blink { height: 20px; width: 6px; }
            .logo .tag { font-size: 11px; }
            .video-grid { gap: 18px; }
            .video-card { padding: 10px 10px 14px; border-radius: 14px; }
            .video-cover { border-radius: 10px; }
            .video-cover .cover-symbol { font-size: 36px; }
            .video-cover .play-icon { width: 36px; height: 36px; }
            .play-icon svg { width: 14px; height: 14px; }
            .video-title { font-size: 14px; }
            .video-desc { font-size: 12px; -webkit-line-clamp: 2; }
            .video-meta { font-size: 10px; padding-top: 8px; margin-top: 8px; }
            .modal-box { padding: 14px 12px 16px; border-radius: 16px; }
            .modal-video-wrapper { border-radius: 10px; }
            .modal-info .title { font-size: 15px; }
            .modal-info .title .badge { font-size: 10px; padding: 0 8px; margin-left: 6px; }
            .modal-info .hint { font-size: 10px; }
            .modal-info .hint kbd { font-size: 10px; padding: 1px 6px; }
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <div class="app" role="main">
        <header class="header">
            <div class="logo">
                ❯ GeekVid
                <span class="cursor-blink" aria-hidden="true"></span>
                <span class="tag">// 极客视界</span>
            </div>
            <div class="header-right">
                <span class="time" id="clockDisplay">--:--:--</span>
                &nbsp;·&nbsp; <span>v0.1</span>
            </div>
        </header>

        <div class="video-grid-wrapper">
            <div class="video-grid" id="videoGrid">
                <!-- 由 JavaScript 动态渲染 -->
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-label="视频播放">
        <div class="modal-box">
            <button class="modal-close" id="modalCloseBtn" aria-label="关闭播放器">✕</button>
            <div class="modal-video-wrapper">
                <video id="modalVideo" controls autoplay playsinline preload="metadata">
                    您的浏览器不支持 HTML5 视频。
                </video>
            </div>
            <div class="modal-info">
                <div class="title" id="modalTitle">
                    视频标题
                    <span class="badge">▶ 播放中</span>
                </div>
                <div class="hint">
                    <kbd>ESC</kbd> 关闭
                </div>
            </div>
        </div>
    </div>

    <script>
        // =============================================================
        //  视频数据 —— 已设置为本地文件 geek-video.mp4
        // =============================================================
        const videos = [
            {
            id: 1,
            title: '我的迪克视频',
            description: '这是我的第一个迪克作品',
            url: 'https://cdn.videotourl.net/videos/20a66d58-c44b-47e7-b594-62e6828e380c.mp4',   
            symbol: '&lt;/&gt;',
        },{
            id: 2,
            title: '没有',
            description: '空的',
            url: '',   
            symbol: '&lt;/&gt;',
        }
                       ];

        // =============================================================
        //  渲染卡片
        // =============================================================
        const grid = document.getElementById('videoGrid');

        function renderCards() {
            if (!videos.length) {
                grid.innerHTML = `<div class="empty-state">⏻ 暂无视频</div>`;
                return;
            }

            grid.innerHTML = videos.map(v => {
                const safeTitle = v.title.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const safeDesc = v.description.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const symbol = v.symbol || '&lt;/&gt;';

                return `
                        <div class="video-card" data-id="${v.id}" tabindex="0" role="button" aria-label="播放：${safeTitle}">
                            <div class="video-cover">
                                <span class="cover-symbol">${symbol}</span>
                                <div class="play-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21" /></svg>
                                </div>
                            </div>
                            <div class="video-info">
                                <div class="video-title">
                                    ${safeTitle}
                                    <span class="badge">#${String(v.id).padStart(3, '0')}</span>
                                </div>
                                <div class="video-desc">${safeDesc}</div>
                                <div class="video-meta">
                                    <span><span class="dot"></span> 极客原创</span>
                                    <span>·</span>
                                    <span>点击播放</span>
                                </div>
                            </div>
                        </div>
                    `;
            }).join('');
        }

        renderCards();

        // =============================================================
        //  模态框控制
        // =============================================================
        const overlay = document.getElementById('modalOverlay');
        const videoEl = document.getElementById('modalVideo');
        const modalTitle = document.getElementById('modalTitle');
        const closeBtn = document.getElementById('modalCloseBtn');

        function openModal(video) {
            videoEl.src = video.url;
            videoEl.load();
            modalTitle.innerHTML = `
                    ${video.title.replace(/</g,'&lt;').replace(/>/g,'&gt;')}
                    <span class="badge">▶ 播放中</span>
                `;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            videoEl.play().catch(() => {});
        }

        function closeModal() {
            overlay.classList.remove('active');
            videoEl.pause();
            videoEl.src = '';
            videoEl.load();
            document.body.style.overflow = '';
        }

        grid.addEventListener('click', (e) => {
            const card = e.target.closest('.video-card');
            if (!card) return;
            const id = parseInt(card.dataset.id);
            const video = videos.find(v => v.id === id);
            if (video) openModal(video);
        });

        grid.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                const card = e.target.closest('.video-card');
                if (!card) return;
                e.preventDefault();
                const id = parseInt(card.dataset.id);
                const video = videos.find(v => v.id === id);
                if (video) openModal(video);
            }
        });

        closeBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.classList.contains('active')) {
                closeModal();
            }
        });

        // =============================================================
        //  时钟
        // =============================================================
        function updateClock() {
            const now = new Date();
            document.getElementById('clockDisplay').textContent = now.toTimeString().slice(0, 8);
        }
        updateClock();
        setInterval(updateClock, 1000);

        // =============================================================
        //  代码雨 (Matrix Rain)
        // =============================================================
        (function initMatrix() {
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz<>/{}[]|\\;:+=*-_~!@#$%^&*()';
            const charArray = chars.split('');
            let fontSize = 16;
            let drops = [];
            let speeds = [];

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                fontSize = Math.max(12, Math.min(20, Math.floor(W / 60)));
                const cols = Math.floor(W / fontSize);
                drops = Array.from({ length: cols }, () => Math.floor(Math.random() * -30));
                speeds = Array.from({ length: cols }, () => 0.5 + Math.random() * 1.2);
            }

            function draw() {
                ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
                ctx.fillRect(0, 0, W, H);
                ctx.font = `${fontSize}px 'Fira Code', 'Courier New', monospace`;
                ctx.textAlign = 'center';

                for (let i = 0; i < drops.length; i++) {
                    const ch = charArray[Math.floor(Math.random() * charArray.length)];
                    const y = drops[i] * fontSize;
                    const bright = Math.min(1, (drops[i] % 20) / 15);
                    const alpha = 0.3 + 0.7 * bright;
                    const green = Math.floor(180 + 75 * bright);
                    ctx.fillStyle = `rgba(0, ${green}, 40, ${alpha})`;
                    if (bright > 0.85) {
                        ctx.shadowColor = 'rgba(0, 255, 65, 0.25)';
                        ctx.shadowBlur = 18;
                    } else {
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                    }
                    const x = i * fontSize + fontSize / 2;
                    ctx.fillText(ch, x, y);
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;

                    drops[i] += speeds[i];
                    if (drops[i] * fontSize > H + 50) {
                        drops[i] = Math.floor(Math.random() * -30);
                        speeds[i] = 0.5 + Math.random() * 1.2;
                    }
                }
                requestAnimationFrame(draw);
            }

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    resize();
                }, 200);
            });

            resize();
            draw();
        })();

        console.log('❯ GeekVid 已启动 · 您的视频文件请命名为 geek-video.mp4');
    </script>
</body>
</html>
